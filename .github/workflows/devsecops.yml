name: DevSecOps Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  PRODUCT_NAME: "OWASP Juice Shop"
  ENGAGEMENT_NAME: "DevSecOps CI/CD - ${{ github.ref_name }}"
  NODE_VERSION: "22"

jobs:
  # ──────────────────────────────────────────────
  # SBOM — Software Bill of Materials (CycloneDX)
  # ──────────────────────────────────────────────
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (production only)
        run: npm ci --omit=dev

      - name: Generate SBOM (JSON + XML)
        run: npm run sbom

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            bom.json
            bom.xml
          retention-days: 30

      - name: Upload SBOM to DefectDojo
        if: ${{ secrets.DEFECTDOJO_URL != '' }}
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
        run: |
          curl -sf -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
            -F "scan_type=CycloneDX Scan" \
            -F "file=@bom.json" \
            -F "product_name=${PRODUCT_NAME}" \
            -F "engagement_name=${ENGAGEMENT_NAME}" \
            -F "auto_create_context=true" \
            -F "close_old_findings=false" \
            -F "minimum_severity=Info" \
            || echo "DefectDojo upload skipped (check DEFECTDOJO_URL / DEFECTDOJO_API_TOKEN secrets)"

  # ──────────────────────────────────────────────
  # SCA — Software Composition Analysis
  # ──────────────────────────────────────────────
  sca:
    name: SCA (npm audit + OWASP Dependency Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (known CVEs)
        # exit 0: Juice Shop intentionally uses vulnerable packages
        run: |
          mkdir -p reports
          npm audit --json > reports/npm-audit.json || true
          npm audit --audit-level=critical || true

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: juice-shop
          path: .
          format: ALL
          out: reports/dependency-check
          args: >
            --enableRetired
            --suppression dependency-check-suppressions.xml
            --exclude "**/node_modules/**"
            --exclude "**/frontend/node_modules/**"
            --exclude "**/data/static/codefixes/**"

      - name: Upload SCA reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sca-reports
          path: reports/
          retention-days: 30

      - name: Upload npm audit to DefectDojo
        if: ${{ secrets.DEFECTDOJO_URL != '' }}
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
        run: |
          curl -sf -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
            -F "scan_type=NPM Audit Scan" \
            -F "file=@reports/npm-audit.json" \
            -F "product_name=${PRODUCT_NAME}" \
            -F "engagement_name=${ENGAGEMENT_NAME}" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" \
            -F "minimum_severity=Medium" \
            || echo "DefectDojo npm audit upload skipped"

      - name: Upload OWASP DC to DefectDojo
        if: ${{ secrets.DEFECTDOJO_URL != '' }}
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
        run: |
          curl -sf -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
            -F "scan_type=OWASP Dependency Check" \
            -F "file=@reports/dependency-check/dependency-check-report.xml" \
            -F "product_name=${PRODUCT_NAME}" \
            -F "engagement_name=${ENGAGEMENT_NAME}" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" \
            -F "minimum_severity=Medium" \
            || echo "DefectDojo OWASP DC upload skipped"

  # ──────────────────────────────────────────────
  # SAST — Static Application Security Testing
  # ──────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Semgrep scan
        # Many findings expected — Juice Shop is intentionally vulnerable.
        # Results are informational; build does not fail on findings.
        run: |
          mkdir -p reports
          semgrep scan \
            --config "p/javascript" \
            --config "p/nodejs" \
            --config "p/owasp-top-ten" \
            --config "p/typescript" \
            --config "p/secrets" \
            --sarif \
            --output reports/semgrep.sarif \
            --exclude "data/static/codefixes" \
            --exclude "frontend/node_modules" \
            --exclude "node_modules" \
            --exclude "build" \
            --exclude "dist" \
            || true

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep

      - name: Upload Semgrep artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: semgrep-sarif
          path: reports/semgrep.sarif
          retention-days: 30

      - name: Upload SAST to DefectDojo
        if: ${{ secrets.DEFECTDOJO_URL != '' }}
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
        run: |
          curl -sf -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
            -F "scan_type=SARIF" \
            -F "file=@reports/semgrep.sarif" \
            -F "product_name=${PRODUCT_NAME}" \
            -F "engagement_name=${ENGAGEMENT_NAME}" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" \
            -F "minimum_severity=Medium" \
            || echo "DefectDojo Semgrep upload skipped"

  # ──────────────────────────────────────────────
  # DAST — Dynamic Application Security Testing
  # ──────────────────────────────────────────────
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start Juice Shop via Docker
        run: |
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            bkimminich/juice-shop:latest
          # Wait for app to be ready
          timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 3; done'
          echo "Juice Shop is ready"

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          issue_title: 'ZAP Baseline Scan (CI)'
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zap-reports
          path: |
            report_json.json
            report_html.html
            report_md.md
          retention-days: 30

      - name: Upload DAST to DefectDojo
        if: ${{ secrets.DEFECTDOJO_URL != '' }}
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
        run: |
          curl -sf -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
            -F "scan_type=ZAP Scan" \
            -F "file=@report_json.json" \
            -F "product_name=${PRODUCT_NAME}" \
            -F "engagement_name=${ENGAGEMENT_NAME}" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" \
            -F "minimum_severity=Medium" \
            || echo "DefectDojo ZAP upload skipped"

  # ──────────────────────────────────────────────
  # Dashboard — Aggregate summary in GitHub Actions
  # ──────────────────────────────────────────────
  security-summary:
    name: Security Dashboard Summary
    runs-on: ubuntu-latest
    needs: [sbom, sca, sast, dast]
    if: always()
    steps:
      - name: Download all scan artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-reports/

      - name: Generate GitHub Actions summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## DevSecOps Security Scan Results

          | Pillar | Tool | Status | Artifacts |
          |--------|------|--------|-----------|
          | SBOM | CycloneDX | ${{ needs.sbom.result }} | bom.json, bom.xml |
          | SCA | npm audit + OWASP Dependency Check | ${{ needs.sca.result }} | npm-audit.json, dependency-check/ |
          | SAST | Semgrep | ${{ needs.sast.result }} | semgrep.sarif → GitHub Security tab |
          | DAST | OWASP ZAP | ${{ needs.dast.result }} | report_json.json, report_html.html |

          ### Scan Context
          - **Branch**: `${{ github.ref_name }}`
          - **Commit**: `${{ github.sha }}`
          - **Triggered by**: `${{ github.event_name }}`

          ### Notes
          - SAST (CodeQL) results are in the **Security > Code scanning** tab (separate workflow)
          - All SARIF results (CodeQL + Semgrep) are visible in **Security > Code scanning**
          - Full aggregated dashboard: configure `DEFECTDOJO_URL` + `DEFECTDOJO_API_TOKEN` secrets
          - Expected findings: Juice Shop contains **intentional** vulnerabilities for training purposes
          EOF

      - name: List downloaded artifacts
        run: find all-reports/ -type f | sort || true
